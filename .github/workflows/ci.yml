name: ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Tests (serveur local sur la construction)
        run: |
          python3 -m http.server 4391 -d dist > /dev/null 2>&1 &
          sleep 1
          npm test
      - name: Archive publiable (etiquette uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/apres-build.mjs --archive "${GITHUB_REF_NAME}"
      - name: Release GitHub (archive + sha256)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" "issra-web-${GITHUB_REF_NAME}.tar.gz" "issra-web-${GITHUB_REF_NAME}.tar.gz.sha256" --title "${GITHUB_REF_NAME}" --notes "Site ISSRA web (statique, /issra/). sha256 joint."
